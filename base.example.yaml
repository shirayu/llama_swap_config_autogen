models:
  - /opt/data/llm/models
  # Expected layout under each directory:
  #   <model>/*.gguf
  #   <model>/<variant>/*.gguf
  # Any .gguf outside those depths will raise an error.

# Rewrites host-side model paths (as scanned under `models:`) to the path
# seen by the runtime (e.g. inside a container) for both the generated
# `cmd:` -m argument and any --llama-bin fit-params invocation.
path_prefix_map:
  /opt/data/llm/models/: /models/

default_ttl: 300
healthCheckTimeout: 240
logLevel: warn
startPort: 9091
vram_estimation: true
captureBuffer: 0

# llama-swap official routing / groups (optional)
# groups:
#   default-group:
#     swap: true
#     exclusive: true
#     members:
#       - "deepseek-r1-distill-qwen-32b/distill:Q4_K_M"
#       - "glm-4.7/flash:Q4_K_M"

# llama-swap hooks (optional)
# hooks:
#   on_startup:
#     preload:
#       - "deepseek-r1-distill-qwen-32b/distill:Q4_K_M"

mmproj:
  enabled: true
  auto_attach: true
  arg: --mmproj
  generate_no_mmproj_variant: false
  no_mmproj_suffix: ' (no mmproj)'
  overrides: {}

# Draft (speculative decoding, e.g. MTP) files are auto-discovered by filename
# (matching "mtp" or "draft") and excluded from the standalone model list, the
# same way mmproj files are. When enabled+auto_attach, a draft file found alone
# next to a main model is attached via `--model-draft`. Attachment is skipped
# (with a warning) if the main model's and draft's GGUF vocab sizes disagree.
draft:
  enabled: true
  auto_attach: false
  arg: --model-draft
  overrides: {}

macros:
  # Runtime
  binary: /app/llama-server

  # Shared parts: base
  common-base: --jinja --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on
  default-params: ${common-base} ${ngl:999} ${ctx:32768}
  reasoning-base: ${default-params} --reasoning-format none

  # Parameterized helpers
  ctx: --ctx-size ${1}
  ngl: --n-gpu-layers ${1}
  cpu-offload: --n-cpu-moe ${1} --threads ${2}

  # Shared parts: CPU offload / sampling / memory
  cpu-offload-ffn-full: -ot '.*.ffn_.*_exps.=CPU'
  cpu-offload-moe-max: --cpu-moe
  temp-reasoning: --temp 0.7 --top-p 0.9
  temp-coding: --temp 0.1
  low-memory: --no-mmap --mlock
  memory-efficient: --cache-type-k q4_0 --cache-type-v q4_0
  inference-fast: --batch-size 512 --ubatch-size 512

  # Presets
  deepseek-r1-params: ${reasoning-base} ${temp-reasoning}
  gemma-large-params: ${default-params} ${ngl:25} ${ctx:32768}
  gemma-4-32k-q8-params: ${common-base} ${ngl:999} ${ctx:32768}
  gemma-4-64k-kv-q4-params: ${common-base} ${ngl:999} ${ctx:65536} --cache-type-k q4_0 --cache-type-v q4_0
  gemma-4-128k-kv-q4-params: ${common-base} ${ngl:999} ${ctx:131072} --cache-type-k q4_0 --cache-type-v q4_0
  glm-47-params: ${default-params} --repeat-penalty 1.0 --temp 1.0
  gpt-oss-20b-params: ${reasoning-base} -c 0 -fa
  gpt-oss-120b-params: ${reasoning-base} ${ngl:13} --ctx-size 16384 --no-mmap
  qwen-context-64k-params: ${default-params} ${ctx:65536}
  qwen-context-128k-params: ${default-params} ${ctx:131072}
  qwen-long-context-params: ${default-params} ${ctx:163840}
  qwen-long-context-memory-efficient-params: ${default-params} ${memory-efficient} ${ctx:163840}
  qwen-coder-params: ${default-params} ${temp-coding} ${ctx:32768}
  qwen-cpu-params: ${default-params} ${cpu-offload:12,16} ${ctx:65536}
  # `draft`-tagged files (e.g. mtp-*.gguf) are never emitted as standalone models;
  # attach one to a main model via the `draft:` model_patterns key (see qwen3.8-27b below)
  # or `draft.overrides:`/`draft.auto_attach: true`, then reference this macro.
  qwen-mtp-params: ${default-params} --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.8 --parallel 1

  # Utility presets
  short-ctx-params: ${default-params} ${ctx:4096}
  memory-constrained-params: ${default-params} ${low-memory} ${memory-efficient}

model_patterns:
  # Audio capabilities are declared structurally instead of in model names.
  whisper:
    macro: default-params
    capabilities:
      in: [audio]
      out: [text]

  kokoro:
    macro: default-params
    capabilities:
      out: [audio]

  # Reasoning-focused models
  r1-distill-qwen-32b:
    macro: deepseek-r1-params
    # Locally overrides the global `fast-params` placeholder so that
    # variant_presets.fast's ${fast-params} resolves to this model's macro.
    fast-params: ${deepseek-r1-params} ${inference-fast}
    variants: [fast, short-ctx]

  gpt-oss-120b: gpt-oss-120b-params
  gpt-oss-20b: gpt-oss-20b-params

  # General-purpose large models
  gemma-3-27b:
    macro: gemma-large-params
    variants: [memory-efficient]

  gemma-3-27b/it-qat:
    macro: gemma-large-params
    variants: [memory-efficient, short-ctx]

  gemma-4-31b:
    macro: gemma-4-32k-q8-params
    emit_base: false
    variants: [gemma-4-variants]
    mmproj: unsloth_gemma-4-31B-it-GGUF_mmproj-BF16.gguf

  gemma-4-:
    macro: gemma-4-32k-q8-params
    emit_base: false
    variants: [gemma-4-variants]

  glm-4.7/flash:
    macro: glm-47-params

  # model_patterns are selected by first match in file order.
  # A pattern containing *, ?, or [ is treated as a glob (fnmatch) against the
  # full model id/filename/display name (e.g. "*qwen3*-vl-*" or "gemma-4-3?b").
  # Otherwise it falls back to a plain case-insensitive substring match.
  # Example: attach a same-directory mtp-*.gguf draft file to the main model
  # and use the speculative-decoding macro for it.
  # qwen3.8-27b:
  #   macro: qwen-mtp-params
  #   draft: mtp-Qwen3.8-27B-Q4_0.gguf
  #   variants: [short-ctx]

  qwen3:
    macro: default-params
    variants: [short-ctx, context-64k, context-128k, long-context-q8, long-context-q4, cpu]

  swallow-70b/instruct:
    macro: default-params
    variants: [short-ctx]

  muse-glimmer-30b:
    macro: default-params
    variants: [context-64k]

  # Lightweight models (for memory-constrained environments)
  Phi-3: memory-constrained-params
  TinyLlama: memory-constrained-params

variant_presets:
  # Context-size ladder (short -> long, ~2-3x steps)
  short-ctx:
    - suffix: ' (short ctx)'
      macro: short-ctx-params

  context-64k:
    - suffix: ' (64k ctx)'
      macro: qwen-context-64k-params

  context-128k:
    - suffix: ' (128k ctx)'
      macro: qwen-context-128k-params

  long-context-q8:
    - suffix: ' (long ctx, q8 kv)'
      macro: qwen-long-context-params

  long-context-q4:
    - suffix: ' (long ctx, q4 kv)'
      macro: qwen-long-context-memory-efficient-params

  # Resource-tradeoff variants
  memory-efficient:
    - suffix: ' (Memory Efficient)'
      macro: memory-constrained-params

  cpu:
    - suffix: ' (with CPU)'
      macro: qwen-cpu-params

  # References a macro defined locally on the model_pattern that uses it
  # (see r1-distill-qwen-32b's `fast-params` above).
  fast:
    - suffix: ' (Fast)'
      macro: ${fast-params}

  gemma-4-variants:
    - suffix: ' (32k q8)'
      macro: gemma-4-32k-q8-params
    - suffix: ' (64k q4)'
      macro: gemma-4-64k-kv-q4-params
    - suffix: ' (128k q4 limit)'
      macro: gemma-4-128k-kv-q4-params
